name: Release

# Erzeugt ein GitHub-Release mit signierter APK, auf drei Wegen:
#   - automatisch bei jedem Push auf main, also auch beim Merge eines PRs:
#     die letzte Version wird um eine Patch-Stufe erhoeht (v1.1.0 -> v1.1.1),
#   - von Hand unter Actions -> Release -> Run workflow, optional mit einer
#     eigenen Versionsnummer (z. B. 1.2.0 fuer eine neue Minor-Version),
#   - per Tag: git tag v1.2.0 && git push origin v1.2.0
# Der Schluessel kommt aus den Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS und KEY_PASSWORD.
#
# Den Tag legt "gh release create" mit dem GITHUB_TOKEN an. Solche Tags
# starten keinen neuen Workflow-Lauf, es entsteht also kein doppeltes Release.
#
# Der versionCode ist die Run-Nummer dieses Workflows und steigt mit jedem
# Lauf. Darum muss das Release in dieser Datei bleiben: eine neue Datei
# finge wieder bei 1 an, und Android lehnte das Update ab.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer, z. B. 1.2.0 (leer: letzte Version + 1 Patch)'
        required: false
        default: ''

permissions:
  contents: write

# Zwei schnell hintereinander gemergte PRs duerfen nicht dieselbe Version
# berechnen. Laeufe warten deshalb aufeinander.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Signierte APK veroeffentlichen
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Alle Tags, damit sich die letzte Version bestimmen laesst.
          fetch-depth: 0

      - name: Version bestimmen
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            # Traegt der Commit schon einen Versions-Tag, gibt es dazu
            # bereits ein Release.
            if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
              echo "Commit hat schon einen Versions-Tag, kein neues Release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            last="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            last="${last#v}"
            if [ -z "$last" ]; then
              version="1.0.0"
            else
              IFS=. read -r major minor patch <<< "$last"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ungueltige Versionsnummer \"$version\" (erwartet: X.Y.Z)."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version gibt es schon."
            exit 1
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: JDK 17 einrichten
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        if: steps.version.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Tests
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew :domain:test :app:testDebugUnitTest

      # Ohne Secrets entstuende still eine unsignierte APK, die sich nicht
      # installieren laesst. Dann lieber gleich mit klarer Meldung abbrechen.
      - name: Keystore aus den Secrets holen
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Release-APK bauen
        if: steps.version.outputs.skip != 'true'
        env:
          TAGWERK_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TAGWERK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAGWERK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TAGWERK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAGWERK_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew :app:assembleRelease

      - name: Signatur pruefen
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "tagwerk-${TAG}.apk"

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Die Release-Notizen stellt GitHub aus den PRs und Commits seit dem
      # letzten Tag zusammen. Bei einem Push auf main legt gh den Tag auf
      # genau den gebauten Commit an.
      - name: GitHub-Release anlegen
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ziel="--verify-tag"
          else
            ziel="--target=$GITHUB_SHA"
          fi
          gh release create "$TAG" "tagwerk-${TAG}.apk" \
            --title "TagWerk ${TAG}" \
            --generate-notes \
            "$ziel"
