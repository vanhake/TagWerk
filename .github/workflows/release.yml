name: Release

# Ein Tag wie "v1.2.0" erzeugt ein GitHub-Release mit signierter APK:
#   git tag v1.2.0 && git push origin v1.2.0
# Der Schluessel kommt aus den Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS und KEY_PASSWORD.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signierte APK veroeffentlichen
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :domain:test :app:testDebugUnitTest

      # Ohne Secrets entstuende still eine unsignierte APK, die sich nicht
      # installieren laesst. Dann lieber gleich mit klarer Meldung abbrechen.
      - name: Keystore aus den Secrets holen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Release-APK bauen
        env:
          TAGWERK_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TAGWERK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAGWERK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TAGWERK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Signatur pruefen
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "tagwerk-${GITHUB_REF_NAME}.apk"

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Die Release-Notizen stellt GitHub aus den PRs und Commits seit dem
      # letzten Tag zusammen.
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "tagwerk-${GITHUB_REF_NAME}.apk" \
            --title "TagWerk ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
